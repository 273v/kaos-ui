name: frontend

# pnpm workspace gate: packages/kaos-ui-react plus the single-user-chat
# example. Runs the fresh-clone sequence so the committed pnpm-lock.yaml
# can't drift from the generated examples/single-user-chat/packages/ui
# (gitignored, stamped from kaos_ui/templates/web/spa/packages/ui by
# scripts/sync-ui.sh). A template dependency change must be followed by
# `make sync-ui && pnpm install` and the regenerated lockfile committed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: kaos-x64-16core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Stamp example packages/ui from the web:spa template
        run: ./examples/single-user-chat/scripts/sync-ui.sh

      - name: Install workspace deps (lockfile must be current)
        run: pnpm install --frozen-lockfile

      - name: Build kaos-ui-react
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
