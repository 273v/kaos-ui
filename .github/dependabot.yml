version: 2
updates:
  # Python deps via PEP 621 / uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 3
      exclude:
        - "kaos-*"
    open-pull-requests-limit: 5
    groups:
      deps-minor:
        update-types: ["minor", "patch"]

  # No npm entry: the root pnpm workspace includes
  # examples/single-user-chat/packages/ui, which scripts/sync-ui.sh
  # generates and .gitignore excludes. Dependabot's pnpm updater can't
  # resolve the workspace without it (ERR_PNPM_WORKSPACE_PKG_NOT_FOUND),
  # so JS deps are audited with `pnpm audit` and bumped by hand until the
  # example is split into its own workspace or packages/ui is committed.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-all:
        patterns: ["*"]
