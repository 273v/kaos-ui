packages:
  - "packages/*"
  - "examples/single-user-chat/packages/*"
  - "examples/single-user-chat/apps/*"

# KAOS Node supply-chain baseline:
# - delay newly published dependency versions for 72 hours
# - block transitive git/tarball/file specifiers
# - refuse unreviewed lifecycle build scripts
# - pin newly added dependencies exactly instead of adding semver ranges
minimumReleaseAge: 4320
minimumReleaseAgeStrict: false
minimumReleaseAgeIgnoreMissingTime: true
resolutionMode: highest
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
savePrefix: ""
allowBuilds:
  '@biomejs/biome': true
  esbuild: true

# @hey-api/json-schema-ref-parser (dev-only OpenAPI codegen in the
# single-user-chat example) pins js-yaml exactly, including in its latest
# release; 4.3.2 is the semver-compatible patched line
# (GHSA advisories on js-yaml merge-key / !!omap quadratic CPU).
overrides:
  "@hey-api/json-schema-ref-parser>js-yaml": "4.3.2"
